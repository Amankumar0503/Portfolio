# Free Render web service. Render builds the Dockerfile from this repo.
# The prebuilt GHCR image is published by GitHub Actions, but it does not
# exist until that workflow runs, so the service does not pull it.
services:
  - type: web
    name: portfolio
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_DB
        value: portfolio
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /admin/login
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
        value: /admin/login
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
